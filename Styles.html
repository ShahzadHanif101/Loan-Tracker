<style>
  /* =====================================================
   GLOBAL
===================================================== */

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    padding: 0;

    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    background: #f3f5f9;
    color: #1f2937;
  }

  /* =====================================================
   HEADER
===================================================== */

  .header {
    background: #1565c0;
    color: white;
    padding: 22px 18px;
  }

  .header-content {
    max-width: 600px;
    margin: 0 auto;
  }

  .header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
  }

  .header p {
    margin: 6px 0 0;
    font-size: 14px;
    opacity: 0.9;
  }

  /* =====================================================
   CONTAINER
===================================================== */

  .container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
  }

  /* =====================================================
   LABELS
===================================================== */

  label {
    display: block;

    margin-top: 16px;
    margin-bottom: 7px;

    font-size: 14px;
    font-weight: 600;

    color: #374151;
  }

  /* =====================================================
   INPUTS
===================================================== */

  select,
  input,
  textarea {
    width: 100%;

    padding: 14px;

    border: 1px solid #d1d5db;

    border-radius: 12px;

    background: white;

    color: #111827;

    font-size: 16px;

    outline: none;

    -webkit-appearance: none;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  select:focus,
  input:focus,
  textarea:focus {
    border-color: #1565c0;

    box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
  }

  /* =====================================================
   DATE ROW
===================================================== */

  .date-row {
    display: flex;
    gap: 10px;
  }

  .date-row > div {
    flex: 1;
  }

  /* =====================================================
   BUTTONS
===================================================== */

  button {
    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 15px;

    margin-top: 14px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    min-height: 52px;

    transition:
      transform 0.1s ease,
      opacity 0.1s ease;
  }

  button:active {
    transform: scale(0.98);

    opacity: 0.9;
  }

  button:disabled {
    opacity: 0.6;

    cursor: not-allowed;
  }

  .primary {
    background: #1565c0;

    color: white;
  }

  .secondary {
    background: white;

    color: #1565c0;

    border: 2px solid #1565c0;
  }

  /* =====================================================
   PLACEHOLDER
===================================================== */

  .placeholder {
    background: white;

    margin-top: 20px;

    padding: 30px 20px;

    border-radius: 16px;

    text-align: center;

    border: 1px solid #e5e7eb;
  }

  .placeholder-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .placeholder-title {
    font-size: 17px;

    font-weight: 700;

    color: #374151;
  }

  .placeholder-text {
    margin-top: 6px;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.5;
  }

  /* =====================================================
   SUMMARY
===================================================== */

  .summary {
    margin-top: 20px;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
  }

  .summary-card {
    background: white;

    border-radius: 15px;

    padding: 16px;

    border: 1px solid #e5e7eb;
  }

  .summary-card.full {
    grid-column: 1 / -1;
  }

  .summary-label {
    font-size: 13px;

    margin-bottom: 7px;
  }

  .summary-value {
    font-size: 21px;

    font-weight: 700;
  }

  /* =====================================================
   GIVEN — RED
===================================================== */

  .summary-card.given {
    background: #fff1f2;

    border-color: #fecdd3;
  }

  .summary-card.given .summary-label {
    color: #be123c;
  }

  .summary-card.given .summary-value {
    color: #be123c;
  }

  /* =====================================================
   RETURNED — GREEN
===================================================== */

  .summary-card.returned {
    background: #ecfdf5;

    border-color: #a7f3d0;
  }

  .summary-card.returned .summary-label {
    color: #047857;
  }

  .summary-card.returned .summary-value {
    color: #047857;
  }

  /* =====================================================
   OUTSTANDING — BLUE
===================================================== */

  .summary-card.balance {
    background: #eaf2ff;

    border-color: #bfdbfe;
  }

  .summary-card.balance .summary-label {
    color: #1d4ed8;
  }

  .summary-card.balance .summary-value {
    color: #1565c0;
  }

  /* =====================================================
   TRANSACTION SECTION
===================================================== */

  .section-title {
    margin-top: 25px;

    margin-bottom: 10px;

    font-size: 18px;

    font-weight: 700;

    color: #111827;
  }

  /* =====================================================
   TRANSACTION CARD
===================================================== */

  .transaction-card {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 15px;

    padding: 15px;

    margin-bottom: 10px;
  }

  .transaction-top {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 10px;
  }

  .transaction-date-area {
    flex: 1;
  }

  .transaction-date {
    font-size: 14px;

    font-weight: 600;

    color: #374151;
  }

  .transaction-id {
    margin-top: 3px;

    font-size: 12px;

    color: #9ca3af;

    font-family: monospace;
  }

  .transaction-amount {
    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;
  }

  .transaction-type {
    display: inline-block;

    margin-top: 9px;

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: 700;
  }

  .transaction-type.given {
    background: #fff1f2;

    color: #be123c;
  }

  .transaction-type.returned {
    background: #ecfdf5;

    color: #047857;
  }

  .transaction-card .notes {
    margin-top: 10px;

    padding-top: 10px;

    border-top: 1px solid #f0f0f0;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.4;
  }

  /* =====================================================
   CARD ACTIONS
===================================================== */

  .transaction-actions {
    display: flex;

    gap: 8px;

    margin-top: 13px;

    padding-top: 12px;

    border-top: 1px solid #f0f0f0;
  }

  .action-button {
    flex: 1;

    width: auto;

    min-height: 42px;

    padding: 10px;

    margin: 0;

    border-radius: 10px;

    font-size: 14px;
  }

  .edit-button {
    background: #eff6ff;

    color: #1d4ed8;

    border: 1px solid #bfdbfe;
  }

  .delete-button {
    background: #fff1f2;

    color: #be123c;

    border: 1px solid #fecdd3;
  }

  /* =====================================================
   EMPTY RESULTS
===================================================== */

  .empty-results {
    background: white;

    border-radius: 15px;

    padding: 25px 18px;

    margin-top: 20px;

    text-align: center;

    border: 1px solid #e5e7eb;
  }

  .empty-results .icon {
    font-size: 30px;
  }

  .empty-results .title {
    margin-top: 8px;

    font-weight: 700;

    color: #374151;
  }

  .empty-results .text {
    margin-top: 5px;

    font-size: 14px;

    color: #6b7280;
  }

  /* =====================================================
   LOADING
===================================================== */

  .loading {
    background: white;

    border-radius: 15px;

    padding: 25px;

    margin-top: 20px;

    text-align: center;

    color: #6b7280;
  }

  /* =====================================================
   MOBILE
===================================================== */

  @media (max-width: 420px) {
    .container {
      padding: 14px;
    }

    .header {
      padding: 20px 16px;
    }

    .header h1 {
      font-size: 23px;
    }

    .summary-value {
      font-size: 19px;
    }
  }
</style>

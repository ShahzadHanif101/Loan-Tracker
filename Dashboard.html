<!doctype html>
<html>
  <head>
    <base target="_top" />

    <?!= include('Styles'); ?>
  </head>

  <body>
    <!-- =====================================================
     DASHBOARD
===================================================== -->

    <div id="dashboard">
      <div class="header">
        <div class="header-content">
          <h1>💰 Loan Tracker</h1>

          <p>Keep track of money you lend</p>
        </div>
      </div>

      <div class="container">
        <label>Select Person</label>

        <select id="person">
          <option value="">Select a person</option>
        </select>

        <div class="date-row">
          <div>
            <label>From</label>

            <input type="date" id="fromDate" />
          </div>

          <div>
            <label>To</label>

            <input type="date" id="toDate" />
          </div>
        </div>

        <button class="primary" onclick="viewRecords()">View Records</button>

        <button class="secondary" onclick="showAddForm()">
          + Add New Transaction
        </button>

        <div id="result">
          <div class="placeholder">
            <div class="placeholder-icon">📋</div>

            <div class="placeholder-title">No records loaded</div>

            <div class="placeholder-text">
              Select a person and date range, then tap View Records.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- =====================================================
     ADD / EDIT TRANSACTION
===================================================== -->

    <div id="addPage" style="display: none">
      <div class="header">
        <div class="header-content">
          <h1 id="formTitle">➕ Add Transaction</h1>

          <p id="formSubtitle">New loan record</p>
        </div>
      </div>

      <div class="container">
        <!-- Hidden transaction ID -->

        <input type="hidden" id="editId" />

        <label>Person</label>

        <select id="addPerson"></select>

        <label>Date</label>

        <input type="date" id="addDate" />

        <label>Type</label>

        <select id="addType">
          <option value="Given">Given</option>

          <option value="Returned">Returned</option>
        </select>

        <label>Amount</label>

        <input
          type="number"
          id="addAmount"
          placeholder="0.00"
          inputmode="decimal"
          min="0"
          step="0.01"
        />

        <label>Notes</label>

        <textarea id="addNotes" placeholder="Optional" rows="3"></textarea>

        <button class="primary" id="saveButton" onclick="saveTransaction()">
          Save Transaction
        </button>

        <button class="secondary" onclick="goDashboard()">Cancel</button>
      </div>
    </div>
